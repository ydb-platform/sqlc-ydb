version: "2"
sql:
  - engine: ydb
    schema: schema.sql
    queries: queries.sql
    gen:
      go:
        out: db/native
        sql_package: ydb
        emit_json_tags: true
        json_tags_case_style: snake
        rename:
          display_name: Label
  - engine: ydb
    schema: schema.sql
    queries: queries.sql
    gen:
      go:
        out: db/stdlib
        sql_package: database/sql
        emit_json_tags: true
        json_tags_case_style: pascal
        rename:
          display_name: Label
