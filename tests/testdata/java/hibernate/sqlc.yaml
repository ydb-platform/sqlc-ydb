version: "2"

engines:
  - name: ydb
    process:
      cmd: sqlc-engine-ydb

plugins:
  - name: ydb-java
    process:
      cmd: sqlc-gen-ydb-java

sql:
  - engine: ydb
    schema: "../../schema.sql"
    queries: "../../queries.sql"
    codegen:
      - plugin: ydb-java
        out: java
        options:
          package: db
          sql_package: "hibernate"
