version: "2"

engines:
  - name: ydb
    process:
      cmd: sqlc-engine-ydb

plugins:
  - name: ydb-rust
    process:
      cmd: sqlc-gen-ydb-rust

sql:
  - engine: ydb
    schema: "../../schema.sql"
    queries: "../../queries.sql"
    codegen:
      - plugin: ydb-rust
        out: rust
        options:
          package: db
