version: "2"
sql:
  - name: native
    engine: ydb
    schema: schema.sql
    queries: queries.sql
    gen:
      kotlin:
        package: batch.nativeapi
        out: kotlin/nativeapi
        runtime: ydb
      php:
        out: php/native
        namespace: Batch\Native
        runtime: ydb
      typescript:
        out: typescript/native
        runtime: ydb
      rust:
        out: rust/native
        runtime: ydb
      go:
        package: batch
        out: go/native
        sql_package: ydb
        emit_json_tags: true
        emit_interface: true
  - name: portable
    engine: ydb
    schema: schema.sql
    queries: queries.sql
    gen:
      go:
        package: batch
        out: go/database/sql
        sql_package: database/sql
  - name: dapper
    engine: ydb
    schema: schema.sql
    queries: queries.sql
    gen:
      csharp:
        namespace: Batch.Dapper
        out: csharp/dapper
        runtime: dapper
  - name: jooq
    engine: ydb
    schema: schema.sql
    queries: queries.sql
    gen:
      java:
        package: batch.jooq
        out: java/jooq
        runtime: jooq
  - name: cpp-native
    engine: ydb
    schema: schema.sql
    queries: queries.sql
    gen:
      cpp:
        namespace: batch::native
        out: cpp/native
        runtime: ydb
  - name: cpp-userver
    engine: ydb
    schema: schema.sql
    queries: queries.sql
    gen:
      cpp:
        namespace: batch::userver
        out: cpp/userver
        runtime: userver
