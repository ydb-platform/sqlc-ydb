version: "2"
sql:
  - name: native
    engine: ydb
    schema: schema.sql
    queries: queries.sql
    gen:
      php:
        out: php/native
        namespace: Batch\Native
        runtime: ydb
      typescript:
        out: typescript/native
        runtime: ydb
      rust:
        out: rust/native
        runtime: ydb
      go:
        package: batch
        out: go/native
        sql_package: ydb
        emit_json_tags: true
        emit_interface: true
  - name: portable
    engine: ydb
    schema: schema.sql
    queries: queries.sql
    gen:
      go:
        package: batch
        out: go/database/sql
        sql_package: database/sql
  - name: dapper
    engine: ydb
    schema: schema.sql
    queries: queries.sql
    gen:
      csharp:
        namespace: Batch.Dapper
        out: csharp/dapper
        runtime: dapper
  - name: linq2db
    engine: ydb
    schema: schema.sql
    queries: queries.sql
    gen:
      csharp:
        namespace: Batch.Linq2DB
        out: csharp/linq2db
        runtime: linq2db
