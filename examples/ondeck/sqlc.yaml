version: "2"
sql:
  - name: native
    engine: ydb
    schema: schema
    queries: query
    gen:
      go:
        package: ondeck
        out: go/native
        sql_package: ydb
  - name: portable
    engine: ydb
    schema: schema
    queries: query
    gen:
      go:
        package: ondeck
        out: go/database/sql
        sql_package: database/sql
