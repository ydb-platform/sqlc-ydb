version: "2"
sql:
  - name: native
    engine: ydb
    schema: schema.sql
    queries: queries.sql
    gen:
      php:
        out: php/native
        namespace: Jets\Native
        runtime: ydb
      typescript:
        out: typescript/native
        runtime: ydb
      rust:
        out: rust/native
        runtime: ydb
      go:
        package: jets
        out: go/native
        sql_package: ydb
  - name: portable
    engine: ydb
    schema: schema.sql
    queries: queries.sql
    gen:
      go:
        package: jets
        out: go/database/sql
        sql_package: database/sql
  - name: dapper
    engine: ydb
    schema: schema.sql
    queries: queries.sql
    gen:
      csharp:
        namespace: Jets.Dapper
        out: csharp/dapper
        runtime: dapper
  - name: linq2db
    engine: ydb
    schema: schema.sql
    queries: queries.sql
    gen:
      csharp:
        namespace: Jets.Linq2DB
        out: csharp/linq2db
        runtime: linq2db
  - name: jooq
    engine: ydb
    schema: schema.sql
    queries: queries.sql
    gen:
      java:
        package: jets.jooq
        out: java/jooq
        runtime: jooq
