version: "2"
sql:
  - name: native
    engine: ydb
    schema: schema.sql
    queries: queries.sql
    gen:
      kotlin:
        package: jets.nativeapi
        out: kotlin/nativeapi
        runtime: ydb
      php:
        out: php/native
        namespace: Jets\Native
        runtime: ydb
      typescript:
        out: typescript/native
        runtime: ydb
      rust:
        out: rust/native
        runtime: ydb
      go:
        package: jets
        out: go/native
        sql_package: ydb
  - name: portable
    engine: ydb
    schema: schema.sql
    queries: queries.sql
    gen:
      go:
        package: jets
        out: go/database/sql
        sql_package: database/sql
  - name: dapper
    engine: ydb
    schema: schema.sql
    queries: queries.sql
    gen:
      csharp:
        namespace: Jets.Dapper
        out: csharp/dapper
        runtime: dapper
  - name: jooq
    engine: ydb
    schema: schema.sql
    queries: queries.sql
    gen:
      java:
        package: jets.jooq
        out: java/jooq
        runtime: jooq
  - name: cpp-native
    engine: ydb
    schema: schema.sql
    queries: queries.sql
    gen:
      cpp:
        namespace: jets::native
        out: cpp/native
        runtime: ydb
  - name: cpp-userver
    engine: ydb
    schema: schema.sql
    queries: queries.sql
    gen:
      cpp:
        namespace: jets::userver
        out: cpp/userver
        runtime: userver
