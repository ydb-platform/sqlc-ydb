version: "2"
sql:
  - engine: ydb
    schema: schema.sql
    queries: queries.sql
    gen:
      go:
        package: multires
        out: go/native
        sql_package: ydb
        emit_interface: true
  - engine: ydb
    schema: schema.sql
    queries: queries.sql
    gen:
      go:
        package: multires
        out: go/database/sql
        sql_package: database/sql
        emit_interface: true
  - engine: ydb
    schema: schema.sql
    queries: queries.sql
    gen:
      java:
        package: multires.jdbc
        out: java/jdbc
        runtime: jdbc
  - engine: ydb
    schema: schema.sql
    queries: queries.sql
    gen:
      python:
        out: python/native
        runtime: ydb
        emit_async_querier: true
