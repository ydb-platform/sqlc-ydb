version: "2"
sql:
  - engine: ydb
    schema: schema.sql
    queries: queries.sql
    gen:
      go:
        package: devices
        out: go/native
        sql_package: ydb
        emit_json_tags: true
        emit_interface: true
  - engine: ydb
    schema: schema.sql
    queries: queries.sql
    gen:
      go:
        package: devices
        out: go/database/sql
        sql_package: database/sql
        emit_json_tags: true
        emit_interface: true
      java:
        package: streaming.jdbc
        out: java/jdbc/src/main/java/streaming/jdbc
        runtime: jdbc
