    engine: ydb
    schema: schema.sql
    queries: queries.sql
    gen:
      go:
        package: counters
        out: go/native
        sql_package: ydb
  - name: database-sql
    engine: ydb
    schema: schema.sql
    queries: queries.sql
    gen:
      go:
        package: counters
        out: go/database/sql
        sql_package: database/sql
