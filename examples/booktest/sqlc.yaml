version: "2"
sql:
  - name: native
    engine: ydb
    schema: schema.sql
    queries: queries.sql
    gen:
      kotlin:
        package: booktest.nativeapi
        out: kotlin/nativeapi
        runtime: ydb
      php:
        out: php/native
        namespace: Booktest\Native
        runtime: ydb
      typescript:
        out: typescript/native
        runtime: ydb
      rust:
        out: rust/native
        runtime: ydb
      go:
        package: booktest
        out: go/native
        sql_package: ydb
        emit_json_tags: true
        emit_interface: true
        emit_empty_slices: true
  - name: database-sql
    engine: ydb
    schema: schema.sql
    queries: queries.sql
    gen:
      go:
        package: booktest
        out: go/database/sql
        sql_package: database/sql
  - name: dapper
    engine: ydb
    schema: schema.sql
    queries: queries.sql
    gen:
      csharp:
        namespace: Booktest.Dapper
        out: csharp/dapper
        runtime: dapper
  - name: jooq
    engine: ydb
    schema: schema.sql
    queries: queries.sql
    gen:
      java:
        package: booktest.jooq
        out: java/jooq
        runtime: jooq
