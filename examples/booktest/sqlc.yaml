version: "2"
sql:
  - name: native
    engine: ydb
    schema: schema.sql
    queries: queries.sql
    gen:
      go:
        package: booktest
        out: go/native
        sql_package: ydb
        emit_json_tags: true
        emit_interface: true
        emit_empty_slices: true
  - name: database-sql
    engine: ydb
    schema: schema.sql
    queries: queries.sql
    gen:
      go:
        package: booktest
        out: go/database/sql
        sql_package: database/sql
