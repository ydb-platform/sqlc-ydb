version: "2"
sql:
  - name: native
    engine: ydb
    schema: schema.sql
    queries: queries.sql
    gen:
      kotlin:
        package: authors.nativeapi
        out: kotlin/src/generated/kotlin/authors/nativeapi
        runtime: ydb
      php:
        out: php/native
        namespace: Authors\Native
        runtime: ydb
      typescript:
        out: typescript/native
        runtime: ydb
      rust:
        out: rust/native
        runtime: ydb
      go:
        package: authors
        out: go/native
        sql_package: ydb
        emit_json_tags: true
        emit_interface: true
        emit_empty_slices: true
      python:
        out: python/native
        runtime: ydb
      csharp:
        namespace: Authors.AdoNet
        out: csharp/adonet
      cpp:
        namespace: authors::native
        out: cpp/native
        runtime: ydb
      java:
        package: authors.nativeapi
        out: java/native/src/main/java/authors/nativeapi
        runtime: ydb
  - name: portable
    engine: ydb
    schema: schema.sql
    queries: queries.sql
    gen:
      kotlin:
        package: authors.jdbc
        out: kotlin/src/generated/kotlin/authors/jdbc
        runtime: jdbc
      go:
        package: authors
        out: go/database/sql
        sql_package: database/sql
      python:
        out: python/dbapi
        runtime: dbapi
      java:
        package: authors.jdbc
        out: java/jdbc/src/main/java/authors/jdbc
        runtime: jdbc
  - name: exposed
    engine: ydb
    schema: schema.sql
    queries: queries.sql
    gen:
      kotlin:
        package: authors.exposed
        out: kotlin/src/generated/kotlin/authors/exposed
        runtime: exposed
  - name: sqlalchemy
    engine: ydb
    schema: schema.sql
    queries: queries.sql
    gen:
      python:
        out: python/sqlalchemy
        runtime: sqlalchemy
        emit_sync_querier: true
  - name: spring
    engine: ydb
    schema: schema.sql
    queries: queries.sql
    gen:
      java:
        package: authors.spring
        out: java/spring/src/main/java/authors/spring
        runtime: spring
      cpp:
        namespace: authors::userver
        out: cpp/userver
        runtime: userver
  - name: hibernate
    engine: ydb
    schema: schema.sql
    queries: queries.sql
    gen:
      java:
        package: authors.hibernate
        out: java/hibernate/src/main/java/authors/hibernate
        runtime: hibernate
  - name: dapper
    engine: ydb
    schema: schema.sql
    queries: queries.sql
    gen:
      csharp:
        namespace: Authors.Dapper
        out: csharp/dapper
        runtime: dapper
  - name: linq2db
    engine: ydb
    schema: schema.sql
    queries: queries.sql
    gen:
      csharp:
        namespace: Authors.Linq2DB
        out: csharp/linq2db
        runtime: linq2db
  - name: jooq
    engine: ydb
    schema: schema.sql
    queries: queries.sql
    gen:
      java:
        package: authors.jooq
        out: java/jooq
        runtime: jooq
