version: "2"
sql:
  - name: native
    engine: ydb
    schema: schema.sql
    queries: queries.sql
    gen:
      go:
        package: authors
        out: go_ydb
        sql_package: ydb
        emit_json_tags: true
        emit_interface: true
        emit_empty_slices: true
      python:
        package: authors
        out: python_ydb
        runtime: ydb
  - name: portable
    engine: ydb
    schema: schema.sql
    queries: queries.sql
    gen:
      go:
        package: authors
        out: go_sql
        sql_package: database/sql
      python:
        package: authors
        out: python_dbapi
        runtime: dbapi
  - name: sqlalchemy
    engine: ydb
    schema: schema.sql
    queries: queries.sql
    gen:
      python:
        package: authors
        out: python_sqlalchemy
        runtime: sqlalchemy
        emit_sync_querier: true
