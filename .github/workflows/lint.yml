name: lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Read pinned lint version
        id: version
        run: echo "version=$(make lint-version)" >> "$GITHUB_OUTPUT"
      - name: Lint generator
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ steps.version.outputs.version }}
      - name: Lint Go example tests
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ steps.version.outputs.version }}
          working-directory: examples
          args: --config ../.golangci.yml ./...
