name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  standalone:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      CARGO_BUILD_JOBS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: examples/package-lock.json
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: bcmath, curl
          tools: composer:2.10.3
          coverage: none
        env:
          fail-fast: true
      - name: Check standalone generator and generated outputs
        run: make test-release coverage check-examples
      - name: Save generator coverage report
        uses: actions/upload-artifact@v4
        with:
          name: generator-coverage
          path: coverage.out
          if-no-files-found: error
      - name: Upload generator coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.out
          flags: unit
          disable_search: true
          fail_ci_if_error: true
          name: generator
      - name: Install pinned PHP gRPC extension
        timeout-minutes: 5
        run: bash .github/scripts/install-php-grpc
      - name: Compile generated code against published SDKs
        env:
          SQLC_YDB_CSHARP_DOTNET: dotnet
          SQLC_YDB_TEST_MAVEN: mvn
          SQLC_YDB_RUST_SDK_CHECK: "1"
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'
        run: go test -p 1 -count=1 ./internal/codegen/csharp ./internal/codegen/java ./internal/codegen/kotlin ./internal/codegen/rust
      - name: Compile Kotlin Query SDK, JDBC and Exposed examples
        run: mvn -B -f examples/authors/kotlin/pom.xml test-compile
      - name: Compile all Dapper and linq2db examples
        run: dotnet build examples/csharp/GeneratedProfiles.csproj
      - name: Check JavaScript examples against the pinned SDK
        working-directory: examples
        run: npm ci --ignore-scripts && npm run check
      - name: Compile and test Rust examples against the pinned SDK
        run: cargo test --manifest-path examples/rust/Cargo.toml --locked
      - name: Check PHP examples against the pinned SDK
        working-directory: examples/php
        run: |
          composer install --no-interaction --prefer-dist
          composer check

  ydb-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    services:
      ydb:
        image: ydbplatform/local-ydb:26.3.1.8
        ports:
          - 2136:2136
        env:
          GRPC_PORT: 2136
          YDB_USE_IN_MEMORY_PDISKS: "true"
          YDB_DEFAULT_LOG_LEVEL: ERROR
        options: >-
          --hostname localhost
          --health-cmd="/health_check"
          --health-interval=5s
          --health-timeout=10s
          --health-retries=30
    env:
      YDB_CONNECTION_STRING: grpc://localhost:2136/local
      SQLC_YDB_TEST_PYTHON: python3
      CARGO_BUILD_JOBS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: examples/package-lock.json
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: bcmath, curl
          tools: composer:2.10.3
          coverage: none
        env:
          fail-fast: true
      - name: Install pinned PHP gRPC extension
        timeout-minutes: 5
        run: bash .github/scripts/install-php-grpc
      - name: Generate runtime examples
        run: make generate
      - name: Install and compile new runtime examples
        run: |
          dotnet build examples/csharp/GeneratedProfiles.csproj
          npm ci --prefix examples --ignore-scripts
          cargo test --manifest-path examples/rust/Cargo.toml --locked --no-run
          composer install --working-dir=examples/php --no-interaction --prefer-dist
      - name: Install tested Python runtimes
        run: python3 -m pip install -r examples/authors/python/requirements.txt
      # Keep local-ydb acceptance sequential: concurrent tests/compilers can
      # exhaust the memory budget even when they use only one YDB service.
      - name: Compare analyzer types and result ordering with YDB
        run: go test -p 1 -count=1 -timeout=180s -covermode=atomic -coverpkg=./... -coverprofile=coverage-semantic.out ./internal/endtoend -run TestLiveYDBSemanticTypes -v
      - name: Run Go generator runtime tests
        run: go test -p 1 -count=1 -timeout=180s -covermode=atomic -coverpkg=./... -coverprofile=coverage-go-live.out ./internal/codegen/golang -run TestLiveYDB -v
      - name: Run Python generator runtime tests
        run: go test -p 1 -count=1 -timeout=180s -covermode=atomic -coverpkg=./... -coverprofile=coverage-python-live.out ./internal/codegen/python -run TestLiveYDB -v
      - name: Execute all Go examples sequentially
        run: |
          cd examples
          go test -p 1 -count=1 -timeout=180s ./... -v
      - name: Run Python authors example
        working-directory: examples/authors
        run: python3 -m python.smoke
      - name: Run C# ADO.NET example
        working-directory: examples/authors
        env:
          YDB_CONNECTION_STRING: Host=localhost;Port=2136;Database=/local
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'
        run: dotnet run --project csharp/adonet/Authors.AdoNet.csproj
      - name: Run Java native, JDBC, Spring and Hibernate examples sequentially
        run: sh examples/authors/java/run-smoke.sh
      - name: Run Kotlin Query SDK, JDBC and Exposed examples sequentially
        run: sh examples/authors/kotlin/run-smoke.sh
      - name: Run Dapper and linq2db examples sequentially
        env:
          YDB_CONNECTION_STRING: Host=localhost;Port=2136;Database=/local
        run: |
          dotnet run --project examples/csharp/GeneratedProfiles.csproj --no-build -- dapper
          dotnet run --project examples/csharp/GeneratedProfiles.csproj --no-build -- linq2db
      - name: Run all JavaScript examples sequentially
        working-directory: examples
        run: npm run smoke
      - name: Run all Rust examples sequentially
        run: cargo test --manifest-path examples/rust/Cargo.toml --locked --test live_smoke -- --nocapture
      - name: Run all PHP examples sequentially
        working-directory: examples/php
        run: composer smoke
      - name: Save integration coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: generator-integration-coverage
          path: |
            coverage-semantic.out
            coverage-go-live.out
            coverage-python-live.out
          if-no-files-found: error
      - name: Upload integration coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage-semantic.out,./coverage-go-live.out,./coverage-python-live.out
          flags: integration
          disable_search: true
          fail_ci_if_error: true
          name: generator-integration

  cpp-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Generate runtime examples
        run: make generate
      # Finish SDK compilation before starting YDB on this host.
      - name: Build C++ native and userver examples with the pinned SDK image
        run: |
          docker build -t sqlc-ydb-cpp-tests -f examples/authors/cpp/Dockerfile examples/authors/cpp
          docker run --rm -v "$PWD:/workspace" -w /workspace sqlc-ydb-cpp-tests \
            bash -lc 'cmake -S examples/authors/cpp -B examples/authors/cpp/build -GNinja -DCMAKE_PREFIX_PATH=/usr/share/yandex && cmake --build examples/authors/cpp/build --target authors_native authors_userver -j1 -- -k 0'
      - name: Start one disposable YDB service
        run: |
          docker run -d --name sqlc-ydb-cpp-server --hostname localhost \
            -p 2136:2136 -e GRPC_PORT=2136 \
            -e YDB_USE_IN_MEMORY_PDISKS=true -e YDB_DEFAULT_LOG_LEVEL=ERROR \
            ydbplatform/local-ydb:26.3.1.8
          for attempt in {1..60}; do
            if timeout 10 docker exec sqlc-ydb-cpp-server /health_check; then
              exit 0
            fi
            sleep 2
          done
          docker logs --tail 100 sqlc-ydb-cpp-server
          exit 1
      - name: Run C++ native and userver examples sequentially
        run: |
          docker run --rm --network host -v "$PWD:/workspace" -w /workspace \
            -e YDB_CONNECTION_STRING=grpc://localhost:2136/local \
            sqlc-ydb-cpp-tests bash examples/authors/cpp/run-smoke.sh
      - name: Stop the disposable YDB service
        if: always()
        run: docker rm -f sqlc-ydb-cpp-server || true
