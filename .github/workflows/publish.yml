name: publish

on:
  workflow_dispatch:
    inputs:
      version-change:
        description: Version part (before the first stable release, increment from 0.0.0)
        required: true
        type: choice
        options: [PATCH, MINOR, MAJOR]
      release-candidate:
        description: Release candidate (create a draft prerelease)
        required: true
        type: boolean
        default: true
      dry-run:
        description: Build and verify without pushing commits, tags or releases
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: sqlc-ydb-publish
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.prepare.outputs.tag }}
      commit: ${{ steps.prepare.outputs.commit }}
    steps:
      - name: Check release branch
        env:
          DRY_RUN: ${{ inputs.dry-run }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "$DRY_RUN" != true && "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            echo "Publish from the default branch; use dry-run to check another branch." >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/examples/typescript/package-lock.json
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - name: Prepare version and changelog locally
        id: prepare
        env:
          VERSION_PART: ${{ inputs.version-change }}
          RELEASE_CANDIDATE: ${{ inputs.release-candidate }}
        run: |
          python3 .github/scripts/release-version.py prepare \
            --part "$VERSION_PART" --rc "$RELEASE_CANDIDATE" \
            --notes "$RUNNER_TEMP/release-notes.md" >"$RUNNER_TEMP/release.json"
          release_tag=$(jq -r .tag "$RUNNER_TEMP/release.json")
          if [[ "$RELEASE_CANDIDATE" != true ]]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add CHANGELOG.md internal/cli/cli.go
            git commit -m "Release $release_tag"
          fi
          release_commit=$(git rev-parse HEAD)
          echo "tag=$release_tag" >>"$GITHUB_OUTPUT"
          echo "commit=$release_commit" >>"$GITHUB_OUTPUT"
          echo "RELEASE_TAG=$release_tag" >>"$GITHUB_ENV"
          echo "RELEASE_COMMIT=$release_commit" >>"$GITHUB_ENV"
          git bundle create "$RUNNER_TEMP/release-source.bundle" HEAD
          printf '### %s\n\nSource: `%s`\n\nRelease commit: `%s`\n' \
            "$release_tag" "$GITHUB_SHA" "$release_commit" >>"$GITHUB_STEP_SUMMARY"
      - name: Run standalone checks
        run: make test-release test check-examples
      - name: Read pinned lint version
        id: lint-version
        run: echo "version=$(make lint-version)" >> "$GITHUB_OUTPUT"
      - name: Lint release source
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ steps.lint-version.outputs.version }}
      - name: Lint Go examples
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ steps.lint-version.outputs.version }}
          working-directory: examples
          args: --config ../.golangci.yml ./...
      - name: Lint Go example tests
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ steps.lint-version.outputs.version }}
          working-directory: tests/examples/go
          args: --config ../../../.golangci.yml ./...
      - name: Build and verify all six archives sequentially
        run: |
          test "$(go env GOHOSTOS)" = linux
          test "$(go env GOHOSTARCH)" = amd64
          .github/scripts/release check "$RELEASE_TAG"
          mkdir -p dist
          printf '%s\n' "$RELEASE_COMMIT" >dist/COMMIT
          while read -r release_os release_arch; do
            .github/scripts/release build "$RELEASE_TAG" "$RELEASE_COMMIT" "$release_os" "$release_arch" dist
          done <.github/scripts/release-targets
          .github/scripts/release verify "$RELEASE_TAG" dist .github/scripts/release-targets
      - uses: actions/upload-artifact@v4
        with:
          name: release-source
          path: |
            ${{ runner.temp }}/release-source.bundle
            ${{ runner.temp }}/release-notes.md
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
          if-no-files-found: error

  publish:
    if: ${{ !inputs.dry-run }}
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
      RELEASE_BRANCH: ${{ github.event.repository.default_branch }}
      RELEASE_CANDIDATE: ${{ inputs.release-candidate }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: release-source
          path: ${{ runner.temp }}/release-source
      - uses: actions/download-artifact@v4
        with:
          name: release-bundle
          path: dist
      - name: Push the verified commit and tag
        run: |
          git fetch "$RUNNER_TEMP/release-source/release-source.bundle" HEAD
          git checkout --detach "$RELEASE_COMMIT"
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          branch_head=$(git ls-remote --exit-code origin "refs/heads/$RELEASE_BRANCH" | cut -f1)
          if [[ "$branch_head" != "$GITHUB_SHA" ]]; then
            echo "The release branch moved while artifacts were being checked; start a new run." >&2
            exit 1
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "release already exists: $RELEASE_TAG" >&2
            exit 1
          fi
          git tag "$RELEASE_TAG" "$RELEASE_COMMIT"
          git push --atomic origin \
            "$RELEASE_COMMIT:refs/heads/$RELEASE_BRANCH" \
            "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
      - name: Upload verified assets and finish the release
        run: |
          release_flags=(--draft)
          if [[ "$RELEASE_CANDIDATE" == true ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" \
            dist/*.tar.gz dist/*.zip dist/SHA256SUMS \
            "${release_flags[@]}" --verify-tag --title "$RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/release-source/release-notes.md"
          if [[ "$RELEASE_CANDIDATE" != true ]]; then
            gh release edit "$RELEASE_TAG" --draft=false --latest
          fi
